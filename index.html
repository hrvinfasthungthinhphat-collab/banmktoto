<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management System - Hệ thống Quản lý Marketing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .icon-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }
        .icon-container svg {
            width: 60px;
            height: 60px;
        }
        h1 {
            color: #d95f27;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #8a92a6;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .tab-container {
            display: flex;
            background: #f4f6f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            color: #4e5d78;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #1c1c1c;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #4e5d78;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 10px;
            font-size: 15px;
            background-color: #f8f9fa;
            color: #1c1c1c;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #d95f27;
            background-color: #ffffff;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #d95f27;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #c24f1e;
        }
        /* Thông báo alert thông minh */
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: left;
        }
        .alert-danger {
            background-color: #fff0f0;
            color: #e53e3e;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-container">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="10" width="4" height="11" rx="1.5" fill="#4CAF50"/>
            <rect x="10" y="13" width="4" height="8" rx="1.5" fill="#E53935"/>
            <rect x="17" y="5" width="4" height="16" rx="1.5" fill="#1E88E5"/>
        </svg>
    </div>

    <h1>Management System</h1>
    <div class="subtitle">Hệ thống Quản lý Marketing</div>

    <div class="tab-container">
        <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Đăng nhập</button>
        <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Đăng ký tài khoản</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" id="username" placeholder="username" required>
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-submit">
            Đăng nhập <span>➔</span>
        </button>
    </form>
</div>

<script>
    // Đã cấu hình sẵn tài khoản để chạy ngay không cần Firebase
    const DEFAULT_ACCOUNT = {
        username: "admin",
        password: "123"
    };

    function switchTab(type) {
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        
        if (type === 'register') {
            tabLogin.classList.remove('active');
            tabRegister.classList.add('active');
            showAlert('danger', 'Tính năng đăng ký đang bảo trì. Anh vui lòng dùng tài khoản đăng nhập có sẵn.');
        } else {
            tabRegister.remove('active');
            tabLogin.classList.add('active');
            document.getElementById('alertBox').style.display = 'none';
        }
    }

    function showAlert(type, message) {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = `alert alert-${type}`;
        alertBox.innerText = message;
        alertBox.style.display = 'block';
    }

    function handleLogin(event) {
        event.preventDefault();
        
        const userInput = document.getElementById('username').value.trim();
        const passInput = document.getElementById('password').value;

        // Kiểm tra tài khoản đăng nhập nhanh
        if (userInput === DEFAULT_ACCOUNT.username && passInput === DEFAULT_ACCOUNT.password) {
            showAlert('success', 'Đăng nhập thành công! Đang chuyển hướng vào hệ thống...');
            setTimeout(() => {
                alert("Chào mừng anh Thái đã vào hệ thống Quản lý Marketing thành công!");
            }, 800);
        } else {
            showAlert('danger', 'Sai tài khoản hoặc mật khẩu! Anh hãy thử lại với tài khoản: admin / mật khẩu: 123');
        }
    }
</script>

</body>
</html>
